<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yasansvr</title>
    <link rel="icon" type="image/jpeg" href="/favicon.jpeg">
    <link rel="stylesheet" href="/css/style.css?v=5">
</head>

<body>
    <div class="app-container">
        <!-- LEFT SIDEBAR -->
        <aside class="sidebar-left">
            <div class="sidebar-left-inner">
                <div class="profile-header">
                    <img src="/favicon.jpeg" alt="lsinxl profile" class="profile-avatar-large">
                    <h1>lsinxl</h1>
                </div>
                <div class="fingerprint">
                    <span>GPG FINGERPRINT</span><br>
                    <code>E6D1203839F963787A5A0DCEA20A2824BBE013AB</code>
                </div>
                <nav class="nav-links">
                    <a href="https://github.com/yasansvr" target="_blank" class="nav-link">GitHub</a>
                    <a href="https://www.linkedin.com/in/yasansavari/" target="_blank" class="nav-link">LinkedIn</a>
                    <a href="mailto:yasansvr@outlook.com" class="nav-link">Email</a>
                    <a href="https://keys.openpgp.org/vks/v1/by-fingerprint/E6D1203839F963787A5A0DCEA20A2824BBE013AB" class="nav-link">GPG PUBLIC KEY</a>
                </nav>
            </div>
        </aside>

        <!-- MIDDLE FEED -->
        <main class="feed">
            <header class="feed-header">
                <h2>Posts</h2>
                <button id="menu-toggle" class="icon-btn" aria-label="Open menu">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
            </header>
            
            <section id="daily">
                {{ with .Site.GetPage "daily" }}
                <div class="content">
                    {{ .Content }}
                </div>
                {{ else }}
                <div class="empty-state">
                    <p>No daily content.</p>
                </div>
                {{ end }}
            </section>
        </main>
    </div>

    <!-- DRAWER MENU -->
    <div id="drawer-overlay" class="drawer-overlay"></div>
    <div id="drawer" class="drawer">
        <div class="drawer-header">
            <h3>Quick Access</h3>
            <button id="close-drawer" class="icon-btn" aria-label="Close menu">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="drawer-content">
            {{ with .Site.GetPage "daily" }}
            <div id="toc">
                {{ .TableOfContents }}
            </div>
            {{ end }}
        </div>
    </div>

    <!-- JavaScript to wrap posts into tweets -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const contentDiv = document.querySelector('.content');
            if (!contentDiv) return;

            let elements = Array.from(contentDiv.children);
            let currentTweet = null;
            let currentTweetBody = null;
            let tweets = [];

            elements.forEach(el => {
                if (el.tagName === 'H2') {
                    // Start a new tweet wrapper
                    currentTweet = document.createElement('article');
                    currentTweet.className = 'tweet';
                    if (el.id) {
                        currentTweet.id = el.id; // Preserve id for TOC links
                    }
                    
                    // Create avatar
                    let avatarContainer = document.createElement('div');
                    avatarContainer.className = 'tweet-avatar';
                    let avatarImg = document.createElement('img');
                    avatarImg.src = '/favicon.jpeg';
                    avatarImg.alt = 'avatar';
                    avatarContainer.appendChild(avatarImg);

                    // Create body container
                    currentTweetBody = document.createElement('div');
                    currentTweetBody.className = 'tweet-body';

                    // Tweet Meta (Author info + Date)
                    let tweetMeta = document.createElement('div');
                    tweetMeta.className = 'tweet-meta';
                    
                    let authorName = document.createElement('span');
                    authorName.className = 'tweet-author';
                    authorName.innerText = 'lsinxl';

                    let dot = document.createElement('span');
                    dot.className = 'tweet-dot';
                    dot.innerText = '·';

                    let tweetDate = document.createElement('span');
                    tweetDate.className = 'tweet-date';
                    let dateText = el.innerText;
                    tweetDate.innerText = dateText;

                    tweetMeta.appendChild(authorName);
                    tweetMeta.appendChild(dot);
                    tweetMeta.appendChild(tweetDate);

                    currentTweetBody.appendChild(tweetMeta);

                    currentTweet.appendChild(avatarContainer);
                    currentTweet.appendChild(currentTweetBody);

                    // Add Tweet Actions (Copy Button)
                    let tweetActions = document.createElement('div');
                    tweetActions.className = 'tweet-actions';
                    
                    let copyBtn = document.createElement('button');
                    copyBtn.className = 'action-btn copy-btn';
                    copyBtn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
                    copyBtn.title = "Copy post text";
                    copyBtn.onclick = function(e) {
                        e.stopPropagation();
                        let clone = currentTweetBody.cloneNode(true);
                        let meta = clone.querySelector('.tweet-meta');
                        if(meta) meta.remove();
                        let actions = clone.querySelector('.tweet-actions');
                        if(actions) actions.remove();
                        let textToCopy = clone.innerText.trim();
                        
                        navigator.clipboard.writeText(textToCopy).then(() => {
                            let originalHTML = copyBtn.innerHTML;
                            copyBtn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" stroke="#00ba7c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                            setTimeout(() => { copyBtn.innerHTML = originalHTML; }, 2000);
                        });
                    };
                    tweetActions.appendChild(copyBtn);
                    currentTweetBody.appendChild(tweetActions);

                    tweets.push(currentTweet);
                } else if (currentTweetBody) {
                    // Insert content before tweetActions
                    let actions = currentTweetBody.querySelector('.tweet-actions');
                    currentTweetBody.insertBefore(el, actions);
                }
            });

            // Clear original content and append formatted tweets
            contentDiv.innerHTML = '';
            tweets.reverse().forEach(tweet => {
                contentDiv.appendChild(tweet);
            });

            // Drawer logic
            const menuToggle = document.getElementById('menu-toggle');
            const closeDrawer = document.getElementById('close-drawer');
            const drawer = document.getElementById('drawer');
            const drawerOverlay = document.getElementById('drawer-overlay');

            function toggleDrawer() {
                drawer.classList.toggle('open');
                drawerOverlay.classList.toggle('open');
            }

            if (menuToggle) menuToggle.addEventListener('click', toggleDrawer);
            if (closeDrawer) closeDrawer.addEventListener('click', toggleDrawer);
            if (drawerOverlay) drawerOverlay.addEventListener('click', toggleDrawer);
            
            // Close drawer when a TOC link is clicked
            const tocLinks = document.querySelectorAll('#toc a');
            tocLinks.forEach(link => {
                link.addEventListener('click', () => {
                    drawer.classList.remove('open');
                    drawerOverlay.classList.remove('open');
                });
            });
        });
    </script>
</body>

</html>
