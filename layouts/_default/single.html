<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | lsinxl</title>
    <link rel="icon" type="image/jpeg" href="/favicon.jpeg">
    <link rel="stylesheet" href="/css/style.css?v=5">
</head>

<body>
    <div class="app-container">
        <!-- LEFT SIDEBAR -->
        <aside class="sidebar-left">
            <div class="sidebar-left-inner">
                <div class="profile-header">
                    <img src="/favicon.jpeg" alt="lsinxl profile" class="profile-avatar-large">
                    <h1>lsinxl</h1>
                </div>
                <div class="fingerprint">
                    <span>gpg-fingerprint:</span><br>
                    <code>E6D1203839F963787A5A0DCEA20A2824BBE013AB</code>
                </div>
                <nav class="nav-links">
                    <a href="https://github.com/yasansvr" target="_blank" class="nav-link">GitHub</a>
                    <a href="https://www.linkedin.com/in/yasansavari/" target="_blank" class="nav-link">LinkedIn</a>
                    <a href="mailto:yasansvr@outlook.com" class="nav-link">Email</a>
                    <a href="https://keys.openpgp.org/vks/v1/by-fingerprint/E6D1203839F963787A5A0DCEA20A2824BBE013AB" class="nav-link">gpg-pb file</a>
                    <a href="/" class="nav-link">← Back to Home</a>
                </nav>
            </div>
        </aside>

        <!-- MIDDLE FEED -->
        <main class="feed">
            <header class="feed-header">
                <h2>{{ .Title }}</h2>
                <button id="menu-toggle" class="icon-btn" aria-label="Open menu">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
            </header>
            
            <section id="content">
                <article class="tweet" style="cursor: default;">
                    <div class="tweet-avatar">
                        <img src="/favicon.jpeg" alt="avatar">
                    </div>
                    <div class="tweet-body">
                        <div class="tweet-meta">
                            <span class="tweet-author">lsinxl</span>
                        </div>
                        <div class="content">
                            {{ .Content }}
                        </div>
                        
                        <div class="tweet-actions">
                            <button class="action-btn copy-btn" title="Copy post text" onclick="copyPostText(this)">
                                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            </button>
                        </div>
                    </div>
                </article>
            </section>
        </main>
    </div>

    <!-- DRAWER MENU -->
    <div id="drawer-overlay" class="drawer-overlay"></div>
    <div id="drawer" class="drawer">
        <div class="drawer-header">
            <h3>Quick Access</h3>
            <button id="close-drawer" class="icon-btn" aria-label="Close menu">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="drawer-content">
            <div id="toc">
                {{ .TableOfContents }}
            </div>
        </div>
    </div>

    <script>
        function copyPostText(btn) {
            let article = btn.closest('.tweet');
            let textToCopy = article.querySelector('.content').innerText.trim();
            navigator.clipboard.writeText(textToCopy).then(() => {
                let originalHTML = btn.innerHTML;
                btn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" stroke="#00ba7c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                setTimeout(() => { btn.innerHTML = originalHTML; }, 2000);
            });
        }

        document.addEventListener("DOMContentLoaded", function () {
            // Drawer logic
            const menuToggle = document.getElementById('menu-toggle');
            const closeDrawer = document.getElementById('close-drawer');
            const drawer = document.getElementById('drawer');
            const drawerOverlay = document.getElementById('drawer-overlay');

            function toggleDrawer() {
                if(drawer) drawer.classList.toggle('open');
                if(drawerOverlay) drawerOverlay.classList.toggle('open');
            }

            if (menuToggle) menuToggle.addEventListener('click', toggleDrawer);
            if (closeDrawer) closeDrawer.addEventListener('click', toggleDrawer);
            if (drawerOverlay) drawerOverlay.addEventListener('click', toggleDrawer);
            
            const tocLinks = document.querySelectorAll('#toc a');
            tocLinks.forEach(link => {
                link.addEventListener('click', () => {
                    if(drawer) drawer.classList.remove('open');
                    if(drawerOverlay) drawerOverlay.classList.remove('open');
                });
            });
        });
    </script>
</body>

</html>
